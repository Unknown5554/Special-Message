<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine Letter</title>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #fde8e8;
      /* Repeating pixel heart background pattern */
      background-image: radial-gradient(#ff8fa3 15%, transparent 16%), radial-gradient(#ff8fa3 15%, transparent 16%);
      background-size: 60px 60px;
      background-position: 0 0, 30px 30px;
      font-family: 'Press Start 2P', cursive;
      color: #d64545;
    }

    /* Screen 1: Envelope */
    .envelope-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .envelope-screen:hover {
      transform: scale(1.05);
    }

    .envelope {
      width: 140px;
      height: 100px;
      background-color: #fff0f3;
      border: 4px solid #ff4d6d;
      border-radius: 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 0 #ff8fa3;
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      width: 0;
      height: 0;
      border-left: 66px solid transparent;
      border-right: 66px solid transparent;
      border-top: 45px solid #ff4d6d;
    }

    .pixel-heart {
      font-size: 24px;
      color: #ff0054;
      z-index: 2;
      margin-top: 15px;
    }

    .envelope-text {
      margin-top: 20px;
      font-size: 14px;
      letter-spacing: 1px;
    }

    /* Screen 2: Retro Window Card */
    .card-screen {
      display: none;
      width: 340px;
      background-color: #fff0f3;
      border: 4px solid #ff4d6d;
      border-radius: 12px;
      box-shadow: 6px 6px 0 #ff8fa3;
      overflow: hidden;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Window Title Bar */
    .window-header {
      background-color: #ff4d6d;
      color: white;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }

    .window-controls {
      display: flex;
      gap: 6px;
    }

    .control-btn {
      width: 10px;
      height: 10px;
      background-color: white;
      display: inline-block;
    }

    /* Content Area */
    .window-body {
      padding: 20px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .header-hearts {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .question {
      font-size: 11px;
      line-height: 1.6;
      margin-bottom: 15px;
    }

    .cat-gif {
      width: 100px;
      height: 100px;
      object-fit: contain;
      margin-bottom: 15px;
      image-rendering: pixelated;
    }

    /* Buttons Container */
    .buttons {
      display: flex;
      justify-content: center;
      gap: 30px;
      width: 100%;
      position: relative;
      height: 45px;
    }

    .no-wrapper {
      position: relative;
    }

    .btn {
      width: 100px;
      height: 35px;
      font-family: 'Press Start 2P', cursive;
      font-size: 10px;
      border: 3px solid #ff4d6d;
      background-color: white;
      color: #ff4d6d;
      cursor: pointer;
      box-shadow: 3px 3px 0 #ff4d6d;
      transition: transform 0.1s ease;
      display: inline-block;
      line-height: 28px;
    }

    .btn:active {
      transform: translate(2px, 2px);
      box-shadow: 1px 1px 0 #ff4d6d;
    }

    .yes-btn {
      background-color: #ff4d6d;
      color: white;
    }

    .no-btn {
      position: absolute;
      transition: all 0.2s ease;
    }

    .success-info {
      display: none;
      font-size: 10px;
      line-height: 1.5;
      color: #d64545;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="envelope-screen" id="envelopeScreen" onclick="openLetter()">
    <div class="envelope">
      <div class="pixel-heart">♥</div>
    </div>
    <div class="envelope-text">♡ Letter For You ♡</div>
  </div>

  <div class="card-screen" id="cardScreen">
    <div class="window-header">
      <span>LOVE</span>
      <div class="window-controls">
        <span class="control-btn"></span>
        <span class="control-btn"></span>
        <span class="control-btn"></span>
      </div>
    </div>
    
    <div class="window-body">
      <div class="header-hearts">♥ &nbsp; ♥ &nbsp; ♥</div>
      
      <div class="question" id="message">Will you be my Valentine?</div>
      
      <img 
        src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExaGRzdDVwemV0ZWZvaGkyMTJiNjRxNDBhdTJ1MmJwYWl0ZXFwODBibyZlcD12MV9naWZzX3NlYXJjaCZjdD1n/gSQp32H82WETR5EFO6/giphy.gif" 
        alt="Dancing Pixel Cat" 
        class="cat-gif" 
        id="catGif"
      >
      
      <div class="buttons" id="btnGroup">
        <button class="btn yes-btn" onclick="acceptProposal()">YES</button>
        <div class="no-wrapper">
          <button class="btn no-btn" id="noBtn" onmouseover="moveNoButton()" onclick="moveNoButton()">NO</button>
        </div>
      </div>

      <div class="success-info" id="successInfo">
        Thanks Pookie :>❤
      </div>
    </div>
  </div>

  <script>
    function openLetter() {
      document.getElementById('envelopeScreen').style.display = 'none';
      document.getElementById('cardScreen').style.display = 'block';
    }

    function moveNoButton() {
      const noBtn = document.getElementById('noBtn');
      // Moves the NO button around randomly when hovered or clicked
      const randomX = Math.floor(Math.random() * 160) - 80;
      const randomY = Math.floor(Math.random() * 100) - 50;
      noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
    }

function acceptProposal() {
  document.getElementById('message').innerText = "Yippeee!";
  // Swap cat to your uploaded file name
  document.getElementById('catGif').src = "my-picture.png"; 
  document.getElementById('btnGroup').style.display = 'none';
  document.getElementById('successInfo').style.display = 'block';
}
  </script>
</body>
</html>
